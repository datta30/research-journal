apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: research-journal
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/research_journal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  JWT_EXPIRATION: "86400000"
  FILE_UPLOAD_DIR: "/app/uploads"
