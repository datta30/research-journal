{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  selector:
    app: backend
    release: {{ .Release.Name }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: 8080
    protocol: TCP
  type: {{ .Values.backend.service.type }}
{{- end }}
