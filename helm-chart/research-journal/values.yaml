# Default values for research-journal
# This is a YAML-formatted file.

# Global settings
namespace: research-journal

# MySQL Database Configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  
  auth:
    rootPassword: root
    database: research_journal_db
  
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

# Backend (Spring Boot) Configuration
backend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: cicd3-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  config:
    jwtExpiration: "86400000"
    uploadDir: /app/uploads
    hibernateDdlAuto: update
    showSql: false
  
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard
  
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

# Frontend (React) Configuration
frontend:
  enabled: true
  replicaCount: 3
  
  image:
    repository: cicd3-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: LoadBalancer
    port: 80
  
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  host: research-journal.local
  tls:
    enabled: false
