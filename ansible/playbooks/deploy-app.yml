---
# Deploy Research Journal Application using GHCR images

- name: Deploy Research Journal Application
  hosts: all
  become: yes
  
  vars:
    app_dir: /opt/research-journal
    ghcr_registry: "{{ ghcr_registry | default('ghcr.io') }}"
    ghcr_username: "{{ ghcr_username | default(lookup('env', 'GHCR_USERNAME')) }}"
    ghcr_token: "{{ ghcr_token | default(lookup('env', 'GHCR_TOKEN')) }}"
    image_tag: "{{ image_tag | default('latest') }}"
    docker_compose_file: "{{ docker_compose_file | default('docker-compose.prod.yml') }}"
  
  tasks:
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'
    
    - name: Install Git
      apt:
        name: git
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
    
    - name: Login to GitHub Container Registry
      docker_login:
        registry: "{{ ghcr_registry }}"
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: yes
    
    - name: Copy docker-compose production file
      copy:
        src: "../../{{ docker_compose_file }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'
    
    - name: Create .env file for docker-compose
      template:
        src: ../templates/docker.env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'
    
    - name: Stop existing containers
      command: docker-compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes
    
    - name: Pull latest images from GHCR
      command: docker-compose pull
      args:
        chdir: "{{ app_dir }}"
    
    - name: Start containers
      command: docker-compose up -d
      args:
        chdir: "{{ app_dir }}"
    
    - name: Wait for backend to be ready
      wait_for:
        host: localhost
        port: 8080
        delay: 10
        timeout: 300
    
    - name: Wait for frontend to be ready
      wait_for:
        host: localhost
        port: 80
        delay: 5
        timeout: 120
    
    - name: Check container status
      command: docker-compose ps
      args:
        chdir: "{{ app_dir }}"
      register: container_status
    
    - name: Display container status
      debug:
        msg: "{{ container_status.stdout_lines }}"
    
    - name: Verify backend health
      uri:
        url: "http://localhost:8080/actuator/health"
        method: GET
        status_code: 200
      register: backend_health
      retries: 5
      delay: 10
    
    - name: Display backend health status
      debug:
        msg: "Backend is healthy: {{ backend_health.json }}"
