# Ansible Inventory - Define Your Servers

# Development Servers
[development]
dev-server-1 ansible_host=192.168.1.10 ansible_user=admin
dev-server-2 ansible_host=192.168.1.11 ansible_user=admin

# Staging Servers
[staging]
staging-server ansible_host=192.168.1.20 ansible_user=admin

# Production Servers
[production]
prod-server-1 ansible_host=192.168.1.30 ansible_user=admin
prod-server-2 ansible_host=192.168.1.31 ansible_user=admin
prod-server-3 ansible_host=192.168.1.32 ansible_user=admin

# Database Servers
[database]
db-server ansible_host=192.168.1.40 ansible_user=admin

# Group all servers together
[all:children]
development
staging
production
database

# Variables for all servers
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo
